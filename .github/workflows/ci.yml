name: ci

on:
  push:
    paths-ignore: ['**.md', 'docs/**', 'assets/**']
  pull_request:
    paths-ignore: ['**.md', 'docs/**', 'assets/**']
  workflow_dispatch:
    inputs:
      os:
        type: choice
        options: [both, windows, ubuntu]
        default: both
      tests:
        type: string
        default: ''

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: ${{ fromJSON(inputs.os == 'windows' && '["windows-latest"]' || inputs.os == 'ubuntu' && '["ubuntu-latest"]' || '["ubuntu-latest","windows-latest"]') }}
    steps:
      - name: Configure git for LF checkouts
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.longpaths true
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test -- ${{ inputs.tests }}
      - name: Smoke test the packaged CLI
        if: inputs.tests == ''
        shell: bash
        run: |
          npm pack
          tmp="$(mktemp -d)"
          npm install --prefix "$tmp" ./cheap-agent-*.tgz
          out="$("$tmp/node_modules/.bin/cheapag" status)"
          echo "$out"
          echo "$out" | grep -q cheapag
      - name: Live tests when an API key is present
        if: inputs.tests == ''
        shell: bash
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CHEAPAG_LIVE: 1
        run: |
          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo "no API key, skipping live tests"
            exit 0
          fi
          npx vitest run test/live.test.ts
